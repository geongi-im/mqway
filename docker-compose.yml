services:
  nginx:
    container_name: nginx_${COMPOSE_PROJECT_NAME}
    image: nginx:latest
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./html:/var/www/html:cached
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php

  php:
    container_name: php_${COMPOSE_PROJECT_NAME}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    volumes:
      - ./html:/var/www/html
    working_dir: /var/www/html
    environment:
      - DB_HOST=${MYSQL_HOSTNAME}
      - DB_DATABASE=${MYSQL_DATABASE}
      - DB_USERNAME=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    # storage/framework 하위까지 만드는 이유: docker-compose.local.yml이
    # storage/framework를 named volume으로 덮으면 빈 상태로 마운트되어 호스트의
    # cache/sessions/views가 가려진다. 여기서 미리 만들어 두면 로컬이 command를
    # 따로 덮어쓸 필요가 없다(compose는 command를 병합하지 않고 통째로 교체한다).
    # 서버에는 이미 존재하는 디렉터리라 mkdir -p가 no-op이다.
    command: >
      sh -c "
      mkdir -p storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache &&
      chown -R www-data:www-data storage bootstrap/cache &&
      chmod -R 775 storage bootstrap/cache &&
      composer install --no-interaction --no-dev --optimize-autoloader &&
      php artisan storage:link &&
      php artisan migrate --force &&
      php-fpm7.2 -F
      "

  mysql:
    container_name: mysql_${COMPOSE_PROJECT_NAME}
    image: mysql:5.7
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci