# 로컬(Windows/WSL2) 전용. 서버에는 적용하지 않는다.
#
# 사용법:
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml down -v   # 캐시 초기화
#
# include로 base(docker-compose.yml)를 끌어와 -f 하나로 동작한다. 병합 규칙은
# `-f base -f local`과 같아서 base의 command/environment/volumes는 그대로 살아 있고
# 아래 항목만 덧붙거나 덮인다.
#
# 파일명을 override가 아닌 local로 둔 이유: 서버(Ubuntu)는 bind mount가 native
# ext4라 아래 최적화의 이득이 없고, named volume이 호스트 파일을 가려서
# 세션 초기화/vendor 재설치 같은 부작용만 남는다. override.yml이면 서버에서
# git pull만 해도 자동 적용되므로 이름으로 막아 둔다. 서버는 `docker compose up -d`.
include:
  - docker-compose.yml

services:
  # php가 9000을 열 때까지 nginx를 대기시켜 기동 중 502를 없앤다.
  nginx:
    depends_on:
      php:
        condition: service_healthy

  php:
    volumes:
      # 직접 편집하지 않는 의존성/생성물만 named volume(리눅스 VM의 ext4)에 배치해
      # 9p 왕복을 없앤다. 소스(./html)는 base의 bind mount를 그대로 쓴다.
      # storage/logs는 일부러 제외 — 호스트에서 로그를 바로 읽기 위해.
      - vendor:/var/www/html/vendor
      - framework_cache:/var/www/html/storage/framework
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - composer_cache:/root/.composer
    environment:
      # composer 2.2는 COMPOSER_HOME을 디렉터리 존재 여부로 탐색하므로
      # /root/.config가 생기면 캐시가 조용히 volume 밖으로 이동한다. 명시적으로 고정.
      - COMPOSER_CACHE_DIR=/root/.composer/cache
    # composer install + migrate가 끝난 뒤에야 php-fpm이 9000을 연다.
    # 첫 기동은 vendor volume이 비어 있어 full composer install이 걸리므로 넉넉히 둔다.
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      start_period: 600s
      retries: 3

volumes:
  vendor:
  framework_cache:
  bootstrap_cache:
  composer_cache:
